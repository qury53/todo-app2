services:
  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - LOG_FOLDER=/app/out/logs
      - LOG_LEVEL=${LOG_LEVEL}
      - SERVER_ADDR=${SERVER_ADDR}
      - SERVER_SHUTDOWN_TIME=${SERVER_SHUTDOWN_TIME}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
     - "8080:8080"
    restart: always
  todoapp-postgres:
    image: postgres:18.4-bookworm
    container_name: todo-app-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}

    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/swagger/Dockerfile
    volumes:
    - ${PROJECT_ROOT}:/code